<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>Tabletop Command Center</title>
    <meta name="description" content="Offline cybersecurity tabletop exercise command center." />
    <meta name="robots" content="index, follow" />
    <meta property="og:title" content="Tabletop Command Center" />
    <meta property="og:description" content="Offline cybersecurity tabletop exercise command center." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Tabletop Command Center" />
    <meta name="twitter:description" content="Offline cybersecurity tabletop exercise command center." />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <style>
      html, body { margin: 0; min-height: 100%; background: #020617; }
      #startup-fallback {
        min-height: 100vh; display: grid; place-items: center; padding: 24px;
        box-sizing: border-box; color: #f8fafc; font: 16px Arial, sans-serif;
      }
      #startup-fallback section {
        width: min(640px, 100%); padding: 32px; border: 1px solid #1e3a5f;
        border-radius: 12px; background: #0f172a; box-sizing: border-box;
      }
      #startup-fallback h1 { margin: 0 0 12px; font-size: 28px; }
      #startup-fallback p { color: #cbd5e1; line-height: 1.6; }
      #startup-fallback code {
        display: block; white-space: pre-wrap; margin-top: 20px; padding: 12px;
        border-radius: 8px; background: #020617; color: #fecaca; font-size: 12px;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="startup-fallback">
        <section>
          <h1>Loading Tabletop Command Center…</h1>
          <p>The moderator console is starting. If this message remains visible, restart the application.</p>
        </section>
      </div>
    </div>
    <script>
      window.setTimeout(function () {
        var fallback = document.getElementById('startup-fallback');
        if (fallback) {
          fallback.querySelector('h1').textContent = 'Tabletop Command Center could not finish loading';
          fallback.querySelector('p').textContent = 'Restart the application. If the problem continues, confirm that the package was extracted completely.';
        }
      }, 10000);
      window.addEventListener('error', function (event) {
        var fallback = document.getElementById('startup-fallback');
        if (fallback) {
          fallback.querySelector('h1').textContent = 'Tabletop Command Center hit a startup error';
          var detail = document.createElement('code');
          detail.textContent = event.message || 'Unknown startup error';
          fallback.querySelector('section').appendChild(detail);
        }
      });
      window.addEventListener('unhandledrejection', function (event) {
        var fallback = document.getElementById('startup-fallback');
        if (fallback) {
          fallback.querySelector('h1').textContent = 'Tabletop Command Center hit a startup error';
          var detail = document.createElement('code');
          detail.textContent = String(event.reason || 'Unhandled promise rejection');
          fallback.querySelector('section').appendChild(detail);
        }
      });
    </script>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
